name: Transfer checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:secrets
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017
      - run: node scripts/init-local.cjs
      - run: npx playwright install --with-deps chromium
      - run: docker compose --env-file /dev/null -f compose.app.yaml up -d --build --wait
      - run: docker compose --env-file /dev/null -f compose.app.yaml exec -T app node < scripts/smoke.cjs
      - run: npm run test:browser
      - run: bash scripts/backup-local.sh
      - run: node scripts/init-s3.cjs
      - run: docker compose --env-file .env.s3 -f compose.app.yaml -f compose.s3.yaml up -d --build --wait
      - run: docker compose --env-file .env.s3 -f compose.app.yaml -f compose.s3.yaml run --rm --no-deps --user root -v "$PWD/test:/app/test:ro" -e TEST_MONGO_URI=mongodb://mongo:27017 -e TEST_S3=true app node --test test/s3.cjs
      - run: docker compose --env-file .env.s3 -f compose.app.yaml -f compose.s3.yaml exec -T app node < scripts/smoke.cjs
      - run: npm run test:browser
      - run: bash scripts/backup-local.sh s3
      - if: always()
        run: |
          if [ -f .env.s3 ]; then
            docker compose --env-file .env.s3 -f compose.app.yaml -f compose.s3.yaml down
          else
            docker compose --env-file /dev/null -f compose.app.yaml down
          fi
