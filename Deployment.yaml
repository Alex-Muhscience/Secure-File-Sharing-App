# Single-replica template for the local-object-storage implementation.
# Provision app-secrets out of band; never commit secret values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-transfer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: secure-transfer}
  template:
    metadata:
      labels: {app: secure-transfer}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: app
          image: secure-transfer:0.3.0
          ports: [{containerPort: 3000}]
          envFrom: [{secretRef: {name: app-secrets}}]
          env:
            - {name: PORT, value: "3000"}
            - {name: STORAGE_DIR, value: /app/data/objects}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: {path: /ready, port: 3000}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: objects, mountPath: /app/data}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: objects
          persistentVolumeClaim: {claimName: secure-transfer-objects}
        - name: temp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: secure-transfer
spec:
  selector: {app: secure-transfer}
  ports: [{port: 80, targetPort: 3000}]
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secure-transfer-objects
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
